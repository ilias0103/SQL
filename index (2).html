<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SQL / MySQL — Тесты с ответами</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .controls {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .question {
            font-weight: bold;
        }
        .answer {
            margin-top: 8px;
            color: #1b5e20;
            display: none;
        }
        .show .answer {
            display: block;
        }
        .num {
            color: #666;
            margin-right: 5px;
        }
    </style>
</head>
<body>
<h1>SQL / MySQL — тесты с ответами</h1>

<div class="controls">
    <input type="text" id="search" placeholder="Поиск по ключевым словам...">
    <button onclick="toggleAll()">Показать / скрыть все</button>
</div>

<div class="container" id="list"></div>

<script>
const data = [
  ["Оператор IN","Позволяет задавать конкретные значения для поля"],
  ["SELECT LOWER","Функция приведения текста к нижнему регистру"],
  ["SELECT NOW()","Функция текущей даты и времени"],
  ["Оператор UNION","Объединение данных"],
  ["CREATE PROCEDURE","Создать Хранимую Процедуру"],
  ["SELECT UPPER","Функция приведения текста к верхнему регистру"],
  ["SELECT RIGHT","Функция взятия подстроки справа"],
  ["CLOSE product;","Закрыть Курсор"],
  ["Команда UPDATE","Обновление данных в таблице"],
  ["SELECT COUNT(*) AS ProdCount","Функция количества значений"],
  ["CREATE VIEW","Создать Представление"],
  ["`NAME_TYPE_DISK` VARCHAR(40)","Строковое поле"],
  ["CREATE TRIGGER","Создание Триггера"],
  ["Оператор LEFT JOIN","Соединение таблиц, левая главная"],
  ["WHERE (d.ID_TYPE_DISK = td.ID)","Сцепление двух таблиц"],
  ["DECLARE product CURSOR FOR","Объявление Курсора"],
  ["UNTIL done END REPEAT;","Конец цикла"],
  ["FOR EACH ROW","Цикл в Триггере"],
  ["Подзапрос - это","Запрос внутри другого запроса"],
  ["MySQL","Одна из современных бесплатных СУБД"],
  ["Оператор IF","Позволяет задавать простое условие для вычисляемого поля"],
  ["Команда TRUNCATE","Удаление всех данных в таблице"],
  ["Нормализация данных","Приведение информации к виду в виде взаимосвязанных таблиц без дублирования информации"],
  ["Поле записи","Часть записи таблицы данных, имеющая определенный тип"],
  ["SELECT INSERT","Функция вставки текста"],
  ["Оператор INNER JOIN","Соединение таблиц, обе главные"],
  ["CALL `ts_disks_lite`.get_disks('З%')","Вызов Хранимой Процедуры"],
  ["Команда CREATE TABLE","Создание таблицы БД"],
  ["Представление - это","Таблица с данными, которые получаются в результате скрытого предопределенного запроса"],
  ["DELIMITER ;","Указание системного разделителя в Хранимых Процедурах"],
  ["SELECT MAX(PRICE_SEL) AS MaxPrice","Функция максимума"],
  ["BEFORE INSERT ON","Указание вида Триггера"],
  ["Раздел GROUP BY","Группировка данных"],
  ["SELECT REPLACE","Функция замены в тексте"],
  ["DECLARE p_type VARCHAR(40);","Объявление переменной строкового типа в Хранимой Процедуре"],
  ["База данных","Информация, состоящая из одной или нескольких таблиц с данными"],
  ["Раздел ORDER BY","Сортировка данных"],
  ["СУБД","Система управления базами данных"],
  ["DECLARE CONTINUE HANDLER FOR SQLSTATE '02000' SET done = 1;","Объявление обработчика конца Курсора"],
  ["SELECT ROUND(1342.345, 2)","Функция округления числа"],
  ["SELECT DATE_ADD(NOW(), INTERVAL 10 DAY)","Функция увеличения даты и времени"],
  ["Команда INSERT INTO","Вставка данных в таблицу"],
  ["SELECT CONCAT","Функция объединения строк"],
  ["PRICE_PUR DECIMAL(8,2)","Поле для вещественных чисел"],
  ["Вычисляемое поле","Поле, которого нет в таблице данных, которое формируется динамически, путем расчета"],
  ["Импорт данных - это","Загрузка данных в базу данных из внешнего носителя информации"],
  ["Оператор BETWEEN","Позволяет задавать диапазон значений для поля"],
  ["Команда DROP DATABASE","Удаление базы данных"],
  ["SELECT CURTIME()","Функция текущего времени"],
  ["`ID_TYPE_DISK` INTEGER","Целое поле"],
  ["Раздел WHERE","Условие запроса"],
  ["OPEN product;","Открыть Курсор"],
  ["SELECT DATE_SUB(NOW(), INTERVAL 1 MONTH)","Функция уменьшения даты и времени"],
  ["Оператор CASE WHEN","Позволяет задавать сложные условия для вычисляемых полей"],
  ["В фильтре знак _ означает","Один любой символ"],
  ["SELECT TRIM","Функция удаления пробелов"],
  ["Хранимая Процедура - это","Набор команд SQL, которые выдают нужные данные по запросу"],
  ["DECLARE done INT DEFAULT 0;","Объявление переменной целого типа в Хранимой Процедуре"],
  ["WHERE NAME_DISK like 'a%'","Фильтрация данных в таблице"],
  ["PRIMARY KEY (`ID`)","Целое автоинкрементное поле"],
  ["В фильтре знак % означает","Любое количество любых символов"],
  ["Таблица данных","Информация, состоящая из записей, каждая из которых имеет одинаковые поля"],
  ["Экспорт данных - это","Сохранение данных из базы данных на внешний носитель информации"],
  ["SQL","Язык программирования и управления базами данных"],
  ["SELECT (PRICE_SEL * 0.8) as PRICE_D","Создание вычисляемого поля"],
  ["SELECT SUBSTRING","Функция взятия подстроки"],
  ["REPEAT FETCH product INTO p_type, p_count;","Цикл по записям Курсора с инициализацией переменных"],
  ["Оператор RIGHT JOIN","Соединение таблиц, правая главная"],
  ["SELECT SUM(PRICE_SEL) AS TotalCount","Функция суммы"],
  ["Команда DELETE FROM","Удаление данных в таблице"],
  ["Запись таблицы данных","Единица хранения информации в таблице данных"],
  ["SELECT MIN(PRICE_SEL) AS MinPrice","Функция минимума"],
  ["Команда SELECT","Указание списка полей"],
  ["SELECT ABS(- 123)","Функция модуля числа"],
  ["Индекс","Указатель для быстрого поиска информации"],
  ["`ID` INT(11) NOT NULL AUTO_INCREMENT","Целое автоинкрементное поле"],
  ["SELECT CURDATE()","Функция текущей даты"],
  ["Команда CREATE DATABASE","Создание базы данных"],
  ["Раздел FROM","Указание используемых таблиц базы данных"]
];

const list = document.getElementById('list');

function render(filter = '') {
    list.innerHTML = '';
    data.forEach((item, i) => {
        if (!item.join(' ').toLowerCase().includes(filter)) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => card.classList.toggle('show');
        card.innerHTML = `
            <div class="question"><span class="num">${i+1}.</span>${item[0]}</div>
            <div class="answer">${item[1]}</div>
        `;
        list.appendChild(card);
    });
}

function toggleAll() {
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('show'));
}

render();

document.getElementById('search').addEventListener('input', e => {
    render(e.target.value.toLowerCase());
});
</script>
</body>
</html>
