<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет студента — Торайгыров Университет.</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .controls {
            max-width: 900px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .question {
            font-weight: bold;
        }
        .answer {
            margin-top: 8px;
            color: #1b5e20;
            display: none;
        }
        .show .answer {
            display: block;
        }
        .num {
            color: #666;
            margin-right: 5px;
        }
    </style>
</head>
<body>

<h1>Java ООП — тесты с ответами</h1>

<div class="controls">
    <input type="text" id="search" placeholder="Поиск по вопросам...">
    <button onclick="toggleAll()">Показать / скрыть все</button>
</div>

<div class="container" id="list"></div>

  ["Если в пользовательском классе не переопределять метод toString(), какое поведение будет наблюдаться при выводе объекта в консоль?","Имя класса и хеш-код объекта"],
  ["Какое ключевое слово позволяет обратиться к методам и полям родительского класса из подкласса?","super"],

  ["Какое из перечисленных исключений относится к проверяемым?","IOException"],
  ["Какова основная цель применения абстракции в объектно-ориентированном проектировании?","Сокрытие деталей реализации"],

  ["Какой метод InputStream читает один байт?","read()"],

  ["Что будет выведено в консоль в примере с Parent и Child?","-1"],
  ["Какой принцип ООП используется для ограничения доступа к radius ?","Инкапсуляция"],
  ["Какой будет вывод следующей программы с Circle?","Радиус: 7.0"],
  ["Какой порядок вывода сообщений в примере с Phone и Battery?","Батарея → Телефон собран → Включение"],

  ["Какой принцип следует применять при объявлении переменной names ?","Программирование на интерфейсе"],
  ["Что представляет объект Map.Entry ?","Пара ключ–значение"],
  ["Как можно перенаправить стандартный поток вывода System.out ?","System.setOut()"],
  ["Какое основное назначение паттерна Singleton?","Один экземпляр класса"],
  ["Какой паттерн использовать для EmailNotification и SMSNotification ?","Фабричный метод"],
  ["Какую задачу решает паттерн Observer?","Уведомление об изменениях"],
  ["Какой паттерн позволяет выбирать способ оплаты во время выполнения программы?","Strategy"],
  ["Какой паттерн лучше использовать для создания Computer с разными параметрами?","Builder"],
  ["Что будет выведено, если файл data.txt отсутствует?","false"],
  ["Какой символ будет записан в файл при out.write(65) ?","A"],
  ["Что важно для применения стратегии?","Наличие общего интерфейса для алгоритмов"],
  ["В каком месте находится основная «точка расширения» при применении паттерна Фабричный метод в базовом фреймворке?","В переопределяемом фабричном методе"],
  ["Что именно позволяет отделить подход создания объектов от их использования в паттерне «Фабричный метод»?","Вынесение создания объектов в отдельный метод"],
  ["Что будет выведено в консоль при выполнении следующего фрагмента while ((i = inputStream.read()) != -1) { System.out.print((char) i); }","Содержимое потока до конца файла"]
];

const list = document.getElementById('list');

function render(filter = '') {
    list.innerHTML = '';
    data.forEach((item, i) => {
        if (!item.join(' ').toLowerCase().includes(filter)) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => card.classList.toggle('show');
        card.innerHTML = `
            <div class="question"><span class="num">${i+1}.</span>${item[0]}</div>
            <div class="answer">${item[1]}</div>
        `;
        list.appendChild(card);
    });
}

function toggleAll() {
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('show'));
}

render();

document.getElementById('search').addEventListener('input', e => {
    render(e.target.value.toLowerCase());
});
</script>

</body>
</html>
